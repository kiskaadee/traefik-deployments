services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: ${CONTAINER_NAME:-minecraft-server}
    restart: unless-stopped
    ports:
      - "${PORT:-25565}:25565"
    environment:
      - EULA=TRUE
      - TYPE=${TYPE:-PAPER}
      - VERSION=${VERSION:-LATEST}
      - MEMORY=${MEMORY:-2G}
      - TZ=${TZ:-UTC}
    volumes:
      - minecraft_data:/data
    networks:
      - proxy

volumes:
  minecraft_data:

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy-net}
    external: true
